[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Biteship public webhook.
# This exact route must be deployed together with the function above.
[[redirects]]
  from = "/api/biteship-webhook"
  to = "/.netlify/functions/biteship-webhook"
  status = 200
  force = true

# Existing API routes.
[[redirects]]
  from = "/api/ongkir"
  to = "/.netlify/functions/ongkir"
  status = 200
  force = true

[[redirects]]
  from = "/api/biteship-rates"
  to = "/.netlify/functions/biteship-rates"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true


# Prevent the browser from retaining an old admin bundle after a deployment.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"

# Pastikan halaman produk selalu mengambil versi terbaru setelah deploy.
[[headers]]
  for = "/produk.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/api/biteship-health"
  [headers.values]
    Cache-Control = "no-store"
